name: TestFlight

on:
  push:
    branches:
      - main
      - "claude/**"
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

# 같은 브랜치에 연속 푸시 시 이전 빌드 취소 (macOS 러너 분 절약)
concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    name: Build & Upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      ARCHIVE_PATH: ${{ github.workspace }}/build/CocoMatch.xcarchive

    steps:
      - uses: actions/checkout@v4

      - name: Verify required secrets
        env:
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          missing=""
          if [ -z "$APPSTORE_KEY_ID" ]; then missing="$missing APPSTORE_KEY_ID"; fi
          if [ -z "$APPSTORE_ISSUER_ID" ]; then missing="$missing APPSTORE_ISSUER_ID"; fi
          if [ -z "$PRIVATE_KEY" ]; then missing="$missing APPSTORE_PRIVATE_KEY"; fi
          if [ -z "$APPLE_TEAM_ID" ]; then missing="$missing APPLE_TEAM_ID"; fi
          if [ -n "$missing" ]; then
            echo "::error::누락된 GitHub Secrets:$missing — 설정 방법은 docs/TESTFLIGHT_SETUP.md 참고"
            exit 1
          fi

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install App Store Connect API key
        env:
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$PRIVATE_KEY" > "$HOME/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"

      # 선택 사항: 클라우드 서명이 실패하는 경우에만 필요 (docs/TESTFLIGHT_SETUP.md 참고)
      - name: Import distribution certificate (optional)
        if: ${{ env.BUILD_CERTIFICATE_BASE64 != '' }}
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      # 아카이브는 서명 없이 빌드한다. CI에는 등록된 기기가 없어 개발용 프로파일을
      # 만들 수 없기 때문. 서명은 export 단계에서 배포용(App Store)으로 수행된다.
      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project CocoMatch.xcodeproj \
            -scheme CocoMatch \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      # 무서명 아카이브의 내장 프레임워크(광고 SDK 등)에 ad-hoc 서명을 입혀
      # 정상 서명 구조를 만들어준다. export가 전체를 배포용으로 재서명한다.
      - name: Ad-hoc sign app and embedded frameworks
        run: |
          APP="$ARCHIVE_PATH/Products/Applications/CocoMatch.app"
          if [ -d "$APP/Frameworks" ]; then
            for fw in "$APP/Frameworks"/*.framework; do
              /usr/bin/codesign --force --sign - --timestamp=none "$fw"
            done
          fi
          /usr/bin/codesign --force --sign - --timestamp=none "$APP"
          /usr/bin/codesign -dv "$APP" || true

      - name: Export & upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"

      - name: Summary
        run: |
          {
            echo "## 🥥 TestFlight 업로드 완료"
            echo ""
            echo "- 빌드 번호: **$GITHUB_RUN_NUMBER**"
            echo "- App Store Connect에서 처리(5~15분) 후 TestFlight에 나타납니다."
            echo "- https://appstoreconnect.apple.com → 나의 앱 → 코코 매치 → TestFlight"
          } >> "$GITHUB_STEP_SUMMARY"
